version: '3.8'

services:
  codebase-doctor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codebase-doctor-app
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=file:./dev.db
      - SESSION_SECRET=codebase-doctor-prod-secret-9988
      - DEMO_MODE=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
